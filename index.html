<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WST CRM System</title>
<meta name="theme-color" content="#0B3A75">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WST CRM">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FA;--surface:#FFFFFF;--ink:#10243E;--muted:#56677E;--line:#D8E1EC;
  --navy:#0B3A75;--navy2:#0F4B94;--onnavy:#FFFFFF;--onnavy2:#C6D7EF;
  --blue:#1466C3;--link:#0D4F9E;--tint:#E7F0FB;
  --red:#B8322A;--redt:#FBE9E7;--amber:#8F5500;--ambert:#FFF0D4;--green:#16703F;--greent:#E2F3E9;
  --wa:#13804A;--demo:#6B4FB3;
  --r:14px;
  --font:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1320;--surface:#111D2F;--ink:#E3EBF6;--muted:#9AABC1;--line:#23354F;
    --navy:#0B2A55;--navy2:#123A70;--onnavy:#FFFFFF;--onnavy2:#AFC4E3;
    --blue:#5C9FEA;--link:#8DBDF3;--tint:#15294A;
    --red:#F07A70;--redt:#3A1B1A;--amber:#F0B45E;--ambert:#3A2A10;--green:#56C590;--greent:#10301F;
    --wa:#1B9A58;--demo:#A58BEA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1320;--surface:#111D2F;--ink:#E3EBF6;--muted:#9AABC1;--line:#23354F;
  --navy:#0B2A55;--navy2:#123A70;--onnavy:#FFFFFF;--onnavy2:#AFC4E3;
  --blue:#5C9FEA;--link:#8DBDF3;--tint:#15294A;
  --red:#F07A70;--redt:#3A1B1A;--amber:#F0B45E;--ambert:#3A2A10;--green:#56C590;--greent:#10301F;
  --wa:#1B9A58;--demo:#A58BEA;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- header / hero ---------- */
.hero{background:var(--navy);color:var(--onnavy)}
.hero-in{max-width:560px;margin:0 auto;padding:12px 18px 20px}
.topbar{display:flex;align-items:center;gap:8px;min-height:40px}
.topbar .date{flex:1;font-size:13px;color:var(--onnavy2)}
.topbar h1{flex:1;margin:0;font-size:19px;font-weight:600;letter-spacing:.1px}
.topbar h1 .cnt{font-weight:400;color:var(--onnavy2);font-size:15px;margin-left:6px}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden;flex:none}
.langsw button{background:transparent;border:0;color:var(--onnavy2);font-size:12px;padding:5px 9px;line-height:1.2}
.langsw button[aria-pressed="true"]{background:#fff;color:#0B3A75;font-weight:600}
.langsw.light{border-color:var(--line)}
.langsw.light button{color:var(--muted)}
.langsw.light button[aria-pressed="true"]{background:var(--blue);color:#fff}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit;flex:none}
.iconbtn svg{width:22px;height:22px}
.hero .iconbtn{color:var(--onnavy)}
.hello{margin:16px 0 2px;font-size:15px;color:var(--onnavy2)}
.headline{margin:0;font-size:25px;line-height:1.3;font-weight:600}
.meter{display:flex;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.16);margin-top:14px}
.meter i{display:block;height:100%}
.m-over{background:#FF8F80}.m-today{background:#8EC3FF}.m-done{background:#72D6A0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--onnavy2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.btn-hero{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;min-height:52px;border:0;border-radius:14px;background:#fff;color:#0B3A75;font-size:17px;font-weight:700}
.btn-hero svg{width:20px;height:20px}
.btn-hero:disabled{opacity:.55}

/* ---------- sections & rows ---------- */
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.sec{margin:18px 12px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 8px}
.sec-h h2{margin:0;font-size:16px;font-weight:600}
.sec-h .sub{font-size:13px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px 10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.list>.row:first-child,.list>*:first-child .row{border-top:0}
.row:active{background:var(--tint)}
.rail{align-self:stretch;width:4px;flex:none;border-radius:0 4px 4px 0;background:var(--line)}
.rail.over{background:var(--red)}.rail.today{background:var(--blue)}.rail.soon{background:var(--line)}
.rail.lead{background:var(--amber)}.rail.customer{background:var(--blue)}.rail.closed{background:var(--line)}
.rail.now{background:var(--green)}.rail.short{background:var(--amber)}.rail.long{background:var(--green)}
.row .main{flex:1;min-width:0}
.t1{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.t1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:11px;line-height:16px;padding:0 5px;border-radius:5px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.badge.demo{border-color:var(--demo);color:var(--demo)}
.badge.warn{border-color:var(--red);color:var(--red)}
.badge.amber{border-color:var(--amber);color:var(--amber)}
.due{flex:none;font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.due.over{color:var(--red);font-weight:600}
.due.today{color:var(--blue);font-weight:600}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;color:var(--link);font-weight:500}
.banner{display:flex;align-items:center;gap:12px;margin:14px 12px 0;padding:12px 14px;border-radius:var(--r);background:var(--ambert);color:var(--ink);font-size:14px}
.banner .btn{margin-left:auto;min-height:36px;padding:6px 12px;font-size:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 16px;color:var(--muted)}
.stack{display:grid;gap:10px}
.foot{margin:26px 16px 0;text-align:center;font-size:12px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;text-align:center;line-height:1.25}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;min-height:52px;font-size:16px}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;pointer-events:none}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow.three{grid-template-columns:1fr 1fr 1fr}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:8px 2px 6px;border:0;background:none;color:var(--muted);font-size:11.5px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--blue);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.nav .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;line-height:17px;font-weight:600}

/* ---------- chips / segmented ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;white-space:nowrap}
.chip .n{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip[aria-pressed="true"] .n{color:#DCEBFF}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tplgrid .chip{justify-content:flex-start;border-radius:12px;min-height:44px;white-space:normal;text-align:left}

/* ---------- forms ---------- */
.search{margin:12px 12px 10px;position:relative}
.field{display:block;margin:0 0 14px}
.field>.lab{display:block;margin-bottom:5px;font-size:13px;font-weight:500;color:var(--muted)}
.hint{display:block;margin-top:5px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 2px;margin-bottom:14px}
.fs>h4{margin:0 0 12px;font-size:14px;font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:4px 0 14px}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--blue)}
.check b{display:block;font-weight:600}
.err{color:var(--red);font-size:13.5px;margin:6px 0 0}
.only-lead,.only-cus,.only-rental{display:none}
[data-stage="lead"] .only-lead{display:block}
[data-stage="customer"] .only-cus{display:block}
[data-stage="customer"][data-plan="rental"] .only-rental{display:block}

/* ---------- sheet / dialog / toast ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px 4px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;margin:0;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{max-width:560px;margin:0 auto;padding:16px 14px 48px}
.dlg-bg{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(6,18,36,.5)}
.dlg{width:100%;max-width:420px;padding:18px;border-radius:16px;background:var(--surface)}
.dlg p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:95;transform:translateX(-50%);max-width:88vw;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:14px;text-align:center;box-shadow:0 6px 24px rgba(6,18,36,.25)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* ---------- detail ---------- */
.who{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.who h2{margin:0;font-size:22px;line-height:1.25}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qa .btn{flex-direction:column;gap:4px;min-height:64px;font-size:13px;font-weight:500}
.dl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px;margin-bottom:14px}
.dl>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.dl>div:first-child{border-top:0}
.dl dt{color:var(--muted);font-size:14px;flex:none}
.dl dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;text-align:left!important;font-weight:400!important}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist .d{flex:none;width:52px;color:var(--muted);font-size:12.5px;padding-top:1px}
.tip{margin:0 0 14px;padding:10px 12px;border-left:3px solid var(--blue);background:var(--tint);border-radius:0 10px 10px 0;font-size:14px}
.tip.warn{border-left-color:var(--amber);background:var(--ambert)}

/* ---------- trade-in band ---------- */
.win{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.win.in{background:var(--tint);color:var(--link)}
.win.early,.win.fresh,.win.long{background:var(--greent);color:var(--green)}
.win.short{background:var(--ambert);color:var(--amber)}
.band{position:relative;display:grid;grid-template-columns:repeat(16,1fr);gap:2px;height:9px;margin-top:8px}
.band i{border-radius:2px;background:var(--tint)}
.band i.b-early{background:#8FD0AE}.band i.b-fresh{background:#2E9E63}.band i.b-long{background:#8FD0AE}
.band i.b-short{background:repeating-linear-gradient(135deg,#F2B35E 0 3px,#F8D7A6 3px 6px)}
.band i.cur{position:relative;outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.band .off{position:absolute;top:-4px;font-size:11px;color:var(--ink)}
.band .off.l{left:-12px}.band .off.r{right:-12px}
.band-l{display:grid;grid-template-columns:repeat(16,1fr);margin-top:3px;font-size:10.5px;color:var(--muted)}
.band-l span{white-space:nowrap}
.bandbox{padding:12px 14px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.bandbox .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .band{margin-right:2px}

/* ---------- library ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.card p{margin:0 0 8px}
.card ol,.card ul{margin:0;padding-left:20px}
.card li{margin:4px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;font-size:14px}
.flow b{font-weight:600}
.flow .step{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:8px;background:var(--tint)}
.flow .arr{color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;border-top:0}
.obj h3{display:flex;align-items:center;gap:8px}
.script{white-space:pre-wrap;margin:6px 0 10px;padding:12px;border-radius:10px;background:var(--tint);font-size:15px}
.promo{display:grid;gap:4px}
.promo .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.promo .nm{font-weight:600}
.promo .meta{font-size:12.5px;color:var(--muted)}
.red li{margin:8px 0}

/* ---------- queue ---------- */
.qprog{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin:2px 0 16px}
.qprog i{display:block;height:100%;background:var(--blue)}
.qwho{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qwho h2{margin:0;font-size:22px}
.qwhat{margin:4px 0 14px;color:var(--muted)}
.msg{min-height:190px;font-size:16px}
.pending{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--greent);color:var(--green);font-size:14px}

/* ---------- gate / onboarding ---------- */
.gate{max-width:440px;margin:0 auto;padding:40px 22px 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.mark{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:16px;background:var(--navy);color:#fff;font-weight:700;font-size:18px;letter-spacing:.5px;margin-bottom:18px}
.gate h1{margin:0 0 6px;font-size:26px;line-height:1.25}
.gate .lead{margin:0 0 22px;color:var(--muted)}
.gate .langsw{align-self:flex-start;margin-bottom:22px}
.steps{margin:18px 0 22px;padding-left:22px}
.steps li{margin:6px 0}

/* ---------- additions ---------- */
.hero-in.compact{padding-bottom:12px}
[data-stage="closed"] .only-cus{display:block}
[data-stage="closed"][data-plan="rental"] .only-rental{display:block}
.fs>:last-child{margin-bottom:0}
.fs{padding:14px}
.check .hint{margin-top:2px}
.card>:last-child{margin-bottom:0}
.who .badge,.qwho .badge{align-self:center}

/* ---------- v1.2 ---------- */
.pblock{border:1px dashed var(--line);border-radius:12px;padding:12px 12px 2px;margin-bottom:12px}
.pblock-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:14px}
.pb-rent{display:none}
.pblock[data-plan="rental"] .pb-rent{display:block}
.three{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px}
.outs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ck{margin:8px 0 12px;font-size:13px;border-radius:10px;padding:8px 12px}
.ck.ok{color:var(--green);background:var(--greent)}
.ck.warn{color:var(--ink);background:var(--ambert);border:1px solid var(--amber)}
.ck.warn ul{margin:6px 0 0;padding-left:18px}
.btn.warnbtn{background:var(--ambert);border-color:var(--amber);color:var(--ink);min-height:52px;font-size:16px}
.toast .undo{margin-left:12px;padding:2px 4px;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;pointer-events:auto}
.toast{pointer-events:auto}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.pcard .pm{font-size:13px;color:var(--muted);margin-top:4px}
.qalist{margin:12px 0}
.qarow{padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.qarow:first-child{border-top:0}
.qarow.bad{color:var(--red)}

/* ---------- log & undo ---------- */
function logIt(cid, type, key, text) {
  DB.log.push({ c: cid, t: type, k: key || "", x: text || "", at: stamp() });
  if (DB.log.length > 6000) DB.log.splice(0, DB.log.length - 6000);
}
function lastContactMap() {
  const m = {};
  for (const e of DB.log) if ((e.t === "sent" || e.t === "done" || e.t === "call") && (!m[e.c] || e.at > m[e.c])) m[e.c] = e.at;
  return m;
}
function markTask(tk, how) { DB.done[tk.id] = { s: how, at: stamp() }; delete DB.snooze[tk.id]; logIt(tk.cid, how, tk.kind); }
/* marks a task and returns a function that restores the previous state exactly */
function markUndoable(tk, how) {
  const pd = DB.done[tk.id], ps = DB.snooze[tk.id];
  markTask(tk, how);
  const entry = DB.log[DB.log.length - 1];
  return () => {
    if (pd) DB.done[tk.id] = pd; else delete DB.done[tk.id];
    if (ps) DB.snooze[tk.id] = ps;
    const i = DB.log.lastIndexOf(entry);
    if (i >= 0) DB.log.splice(i, 1);
  };
}
function recordSent(it) {
  let u;
  if (it.type === "task" || it.type === "fest") u = markUndoable({ id: it.id, cid: it.cid, kind: it.type === "fest" ? it.key : it.kind }, "sent");
  else {
    logIt(it.cid, "sent", "camp:" + it.key);
    const entry = DB.log[DB.log.length - 1];
    u = () => { const i = DB.log.lastIndexOf(entry); if (i >= 0) DB.log.splice(i, 1); };
  }
  save();
  return u;
}

function custMatch(c, f, td) {

function custList(td, tasks) {
  const next = {};

  const q = S.q.trim().toLowerCase(), qd = q.replace(/\D/g, "").replace(/^0/, "");

    (ordKey(q).length >= 3 && (c.products || []).some(p => ordKey(p.orderNo).indexOf(ordKey(q)) >= 0)) ||
    String(c.area || "").toLowerCase().includes(q) || (qd.length >= 3 && String(c.phone || "").includes(qd))));
  list.sort((a, b) => {

function blastRecipients(td) {

  const fk = /^fest_/.test(b.tpl) ? b.tpl.slice(5) : "", fd = fk ? festDateFor(fk, td) : "";

  for (const c of DB.customers) {

    if (fk && ((c.fest || []).indexOf(fk) < 0 || (fd && DB.done[festId(c.id, fk, fd)]))) continue;

async function copyText(s) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(s); return true; } } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = s; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* ---------- contacts import (.vcf) ---------- */
function qpDecode(s) {
  let out = "";
  for (let i = 0; i < s.length; i++) {
    if (s[i] === "=" && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))) { out += "%" + s.substr(i + 1, 2); i += 2; }
    else out += encodeURIComponent(s[i]);
  }
  try { return decodeURIComponent(out); } catch (e) { return s; }
}
function parseVcf(txt) {
  const lines = String(txt || "").replace(/\r\n?/g, "\n").replace(/\n[ \t]/g, "").split("\n");
  const out = [], seen = new Set();
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^BEGIN:VCARD/i.test(line)) { cur = { fn: "", n: "", tels: [] }; continue; }
    if (/^END:VCARD/i.test(line)) {
      if (cur) {
        const n = cur.n.split(";");
        let name = cur.fn || (/[\u3400-\u9fff]/.test(cur.n) ? (n[0] || "") + (n[1] || "") : [n[1], n[0]].filter(Boolean).join(" "));
        name = name.replace(/\\([,;\\])/g, "$1").replace(/\s+/g, " ").trim().slice(0, 80);
        const ph = cur.tels.map(normPhone).filter(validPhone);
        const phone = ph.find(p => /^601/.test(p)) || ph[0] || "";
        if (name && phone && !seen.has(phone)) { seen.add(phone); out.push({ name: name, phone: phone, pick: false }); }
      }
      cur = null;
      continue;
    }
    if (!cur) continue;
    const ci = line.indexOf(":");
    if (ci < 0) continue;
    const head = line.slice(0, ci);
    let v = line.slice(ci + 1);
    if (/QUOTED-PRINTABLE/i.test(head)) {
      while (/=$/.test(v) && i + 1 < lines.length) v = v.slice(0, -1) + lines[++i];
      v = qpDecode(v);
    }
    const prop = head.split(";")[0].replace(/^item\d+\./i, "").toUpperCase();
    if (prop === "FN") cur.fn = v.trim();
    else if (prop === "N") cur.n = v;
    else if (prop === "TEL") cur.tels.push(v);
  }
  return out;
}

function sixWeek(L7) {

function parseReports(txt) {
  const out = [], ints = s => (s.match(/\d+/g) || []).map(Number);
  let cur = null;
  String(txt || "").replace(/\uFE0F/g, "").split(/\r?\n/).forEach(raw => {
    const s = raw.trim();
    if (!s) return;
    /* multi-message copies from WhatsApp start with "[27/09/2026, 9:01 pm] Name: " */
    const hi = s.indexOf("📊");
    if (hi >= 0 && /周报|weekly report|laporan mingguan/i.test(s.slice(hi))) {
      const parts = s.slice(hi).replace(/^📊\s*/, "").split(/\s*[｜|]\s*/);
      cur = { name: String(parts[1] || parts[0] || "?").trim().slice(0, 40), days: 0, sent: 0, appts: 0, won: 0, inst: 0, cx: 0, why: {}, pend: 0, arr: 0, a30: 0, a60: 0, a90: 0,
        svcNew: 0, svcOpen: 0, refLead: 0, refWon: 0, overdue: 0, bk: -1, six: [0, 0, 0, 0, 0, 0, 0, 0], has6: false, silA: 0, silB: 0, hasSil: false };
      out.push(cur);
      return;
    }
    if (!cur) return;
    const n = ints(s), has = e => s.indexOf(e) === 0;
    if (has("🌱")) {
      ["🔔", "📋", "👥", "❤", "📈", "💡"].forEach((ic, i) => { const m = s.match(new RegExp(ic + "\\s*(\\d+)")); if (m) cur.six[i + 1] = +m[1]; });
      const w = s.match(/⚠\s*(\d+)/);
      cur.six[7] = w ? +w[1] : 0;
      cur.has6 = true;
    }
    else if (has("🔕")) { cur.silA = n[1] || 0; cur.silB = n[2] || 0; cur.hasSil = true; }
    else if (has("📆")) cur.days = n[0] || 0;
    else if (has("✅")) cur.sent = n[0] || 0;
    else if (has("📅")) { if (!/\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) cur.appts = n[0] || 0; }
    else if (has("🎉")) cur.won = n[0] || 0;
    else if (has("🔧")) cur.inst = n[0] || 0;
    else if (has("❌")) {
      cur.cx = n[0] || 0;
      const m = s.match(/[（(](.+)[）)]\s*$/);
      if (m) m[1].split(/\s*·\s*/).forEach(x => { const q = x.match(/^(.*?)\s*(\d+)$/); if (q) cur.why[q[1]] = (cur.why[q[1]] || 0) + +q[2]; });
    }
    else if (has("⏳")) cur.pend = n[0] || 0;
    else if (has("💰")) { cur.arr = n[0] || 0; if (n.length >= 7) { cur.a30 = n[2]; cur.a60 = n[4]; cur.a90 = n[6]; } }
    else if (has("🛠")) { cur.svcNew = n[0] || 0; cur.svcOpen = n[1] || 0; }
    else if (has("🤝")) { cur.refLead = n[0] || 0; cur.refWon = n[1] || 0; }
    else if (has("⏰")) cur.overdue = n[0] || 0;
    else if (has("💾")) cur.bk = n.length ? n[0] : -1;
  });
  const by = {};
  out.forEach(r => { by[r.name] = r; });
  return Object.keys(by).map(k => by[k]);
}

async function saveFile(name, text, mime, onManual) {
  if (DL) {
    try { await DL.save({ filename: name, data: text }); return true; }
    catch (err) { if (err && err.code === "declined") return false; }
  }
  try {
    if (navigator.canShare && typeof File === "function") {
      const f = new File([text], name, { type: mime });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return true; }
    }
  } catch (err) { if (err && err.name === "AbortError") return false; }
  try {
    if (/^https?:/.test(location.protocol) && !INAPP && !("ontouchstart" in window)) {
      const a = document.createElement("a"), u = URL.createObjectURL(new Blob([text], { type: mime }));
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
      return true;
    }
  } catch (err) { /* fall through to copy-text */ }
  openTextSheet(name, text, onManual);
  return false;
}

  qskip: () => { const Q = QUEUE; if (!Q) return; const c = findC(Q.items[Q.i].cid); Q.k++; advance({ name: c ? c.name : "", undo: null, k: "k" }); },
  qhandled: () => {
    const Q = QUEUE; if (!Q) return;
    const it = Q.items[Q.i], c = findC(it.cid), u = markUndoable({ id: it.id, cid: it.cid, kind: it.kind }, "done");
    save(); Q.d++;
    advance({ name: c ? c.name : "", undo: u, k: "d" });
  },
  qnext: () => { if (PENDING) { const p = PENDING; PENDING = null; p.fn(); } else advance(); },
  qclose: () => closeSheet(),
  qundo: () => queueUndo(),
  copyOrd: (el, e, v) => copyAndToast(v),
  fuNew: (el, e, v, id) => openFu(id),
  syncConnect: () => syncConnect(),
  syncGo: () => { syncNow(true); },
  syncOffAsk: () => confirmBox(t("sy_off_q"), t("sy_off"), syncOff, true),
  moveIn: () => openMoveIn(),
  spPersist: () => persistStatus(true),
  fuCat: (el, e, v, id) => openFu(id, null, CATS[v] ? v : ""),
  chkOk: (el, e, v, id) => chkOk(id, v),
  chkBad: (el, e, v, id) => chkBad(id, v),
  introRef: (el, e, v, id) => introRef(id),
  fuEdit: (el, e, v, id) => openFu(id, v),
  fuSave: (el, e, v, id) => fuSave(id, v || null),
  fuDone: (el, e, v, id) => fuComplete(id, v),
  fuDel: (el, e, v, id) => confirmBox(t("fu_del_q"), t("fu_del"), () => fuDelete(id, v), true),
  fuQuick: (el, e, v) => { const i = document.getElementById("fu_d"); if (i) i.value = +v >= 30 ? addMonths(today(), Math.round(+v / 30)) : addDays(today(), +v); },
  undo: () => {
    if (!UNDO) return;
    const f = UNDO; UNDO = null;
    f(); save();
    render();
    toast(t("undone"));
  },
  ckgo: (el, e, v) => {
    const txt = v === "blast" ? S.blast.custom : val(v === "task" ? "tmsg" : "qmsg"), iss = checkMsg(txt);
    const go = () => { S.ack[v] = true; refreshSend(v); };
    if (!iss.length) { go(); return; }
    confirmBox(t("ck_confirm") + "\n\n" + iss.map(i => "• 「" + i.m + "」" + t("ck_" + i.k)).join("\n"), t("ck_go"), go, false, t("ck_back"));
  },
  out: (el, e, v, id) => onOutcome(id, v),
  apnew: (el, e, v, id) => openAppt(id),
  apmenu: (el, e, v, id) => openApptMenu(id, v),
  apedit: (el, e, v, id) => openAppt(id, v),
  apsave: (el, e, v, id) => saveAppt(id, v || null),
  apdel: (el, e, v, id) => confirmBox(t("ap_cancel_q"), t("ap_cancel"), () => delAppt(id, v), true),
  apresult: (el, e, v, id) => openApptResult(id, v),
  apres: (el, e, v, id) => apptResult(id, v, el.dataset.r),
  call: (el, e, v, id) => { logIt(id, "call"); save(); },
  note: (el, e, v, id) => { const x = val("nnote"); if (!x) return; logIt(id, "note", "", x.slice(0, 500)); save(); toast(t("note_saved")); openCustomer(id); },
  fsave: (el, e, v, id) => saveForm(id || null),
  fdel: (el, e, v, id) => confirmBox(t("del_confirm"), t("del_btn"), () => { deleteCustomer(id); save(); closeSheet(); toast(t("deleted")); }, true),
  addp: () => {
    const list = document.getElementById("plist");
    if (!list) return;
    const ps = [...list.querySelectorAll(".pblock")].map(b => ({ id: b.dataset.pid })), fm = document.getElementById("form");
    const hid = (fm && fm.dataset.hid ? fm.dataset.hid.split(",") : []).filter(Boolean).map(id => ({ id: id }));
    list.insertAdjacentHTML("beforeend", pblockHtml(newProduct(ps.concat(hid), "WP"), ps.length + 1));
    renumberBlocks();
    const bl = list.querySelectorAll(".pblock"), last = bl[bl.length - 1];
    if (last && last.scrollIntoView) last.scrollIntoView({ block: "center" });
  },
  delp: el => { const b = el.closest(".pblock"); if (b) { b.remove(); renumberBlocks(); } },
  gate: () => {
    const code = val("gcode").toUpperCase();
    if (code && code === String(CONFIG.TEAM_CODE).toUpperCase()) { DB.gate = true; save(); render(); }
    else { const er = document.getElementById("gerr"); if (er) er.hidden = false; }
  },
  onboard: () => { if (saveProfileFields()) render(); },
  saveProfile: () => { if (saveProfileFields()) toast(t("saved")); },
  report: () => openReport(),
  rcopy: () => copyAndToast(reportText(today())),
  exportJson: () => exportJson(),
  exportCsv: () => exportCsv(),
  importFile: () => { const f = document.getElementById("ifile"); if (f) f.click(); },
  importPaste: () => importText(val("ipaste")),
  demoLoad: () => loadDemo(),
  demoClear: () => clearDemo(),
  reset: () => confirmBox(t("s_reset_confirm"), t("s_reset"), () => { DB = blank(); L = "zh"; save(); closeSheet(true); S.tab = "today"; render(); toast(t("reset_done")); }, true),
  txtcopy: () => { copyAndToast(val("txtout")).then(ok => { if (ok && TXT_CB) { TXT_CB(); TXT_CB = null; } }); },
  quickAdd: () => openQuickAdd(),
  qaadd: () => { const r = applyQuickAdd(QA); QA = []; closeSheet(true); S.tab = "customers"; S.cf = "all"; render(); toast(t("qa_done", { a: r.a, m: r.m })); },
  vcfPick: () => { const f = document.getElementById("vfile"); if (f) f.click(); },
  vcadd: () => vcfAdd()
};
const INP = {
  q: el => { S.q = el.value; const box = document.getElementById("clist"); if (box) { const td = today(); box.innerHTML = custList(td, openTasks(td)); } },
  tmsg: el => onMsgInput(el, "task"),
  qmsg: el => onMsgInput(el, "queue"),
  bcustom: el => {
    S.blast.custom = el.value; S.ack.blast = false;
    const k = document.getElementById("bck"); if (k) k.innerHTML = el.value.trim() ? ckBox(checkMsg(el.value)) : "";
    const s = document.getElementById("bsum"); if (s) s.innerHTML = blastSummary(today());
  },
  stime: el => { if (/^\d{2}:\d{2}$/.test(el.value)) { DB.remind = el.value; save(); const a = document.getElementById("gcal"); if (a) a.href = gcalDaily(DB.remind); } },
  pmodel: el => { const b = el.closest(".pblock"); if (b) blockSvcDefault(b); },
  qatxt: () => qaPreview(),
  vcq: el => { S.vq = el.value; const box = document.getElementById("vclist"); if (box) box.innerHTML = vcfListHtml(); },
  fpq: el => { S.fpq = el.value; const box = document.getElementById("fplist"); if (box) box.innerHTML = fpListHtml(); }
};
const CHG = {
  fstage: el => { const f = document.getElementById("form"); if (f) f.dataset.stage = el.value; },
  fconsent: el => { const f = document.getElementById("form"); if (f) f.dataset.consent = el.checked ? "1" : ""; },
  pcat: el => {
    const b = el.closest(".pblock"); if (!b) return;
    const m = b.querySelector(".f-model");
    m.setAttribute("list", "dl_" + el.value);
    if (m.value && !findModel(el.value, m.value) && Object.keys(CATS).some(k => findModel(k, m.value))) m.value = "";
    blockSvcDefault(b);
  },
  pplan: el => { const b = el.closest(".pblock"); if (b) b.dataset.plan = el.value; },
  pst: el => { const b = el.closest(".pblock"); if (b) b.dataset.st = el.value; },
  fsrc: el => { const f = document.getElementById("form"); if (f) f.dataset.src = el.value; },
  fpick: el => festToggle(el.dataset.id, el.checked),
  psvc: el => { const b = el.closest(".pblock"); if (b) b.dataset.touched = "1"; },
  bcat: el => { S.blast.cat = el.value; render(); },
  bwin: el => { S.blast.win = el.value; render(); },
  brecent: el => { S.blast.recent = el.checked; render(); },
  bpromo: el => { S.blast.promo = el.value; const s = document.getElementById("bsum"); if (s) s.innerHTML = blastSummary(today()); },
  bcpromo: el => { S.blast.customPromo = el.checked; render(); },
  ifile: el => {
    const f = el.files && el.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importText(String(r.result || ""));
    r.onerror = () => toast(t("import_fail"));
    r.readAsText(f);
    el.value = "";
  },
  vfile: el => {
    const f = el.files && el.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { VCF = parseVcf(String(r.result || "")); if (!VCF.length) { toast(t("vcf_none")); return; } openVcf(); };
    r.onerror = () => toast(t("import_fail"));
    r.readAsText(f);
    el.value = "";
  },
  vcpick: el => { const i = +el.dataset.n; if (VCF[i]) VCF[i].pick = el.checked; vcfCount(); },
  cap: el => { const n = +el.value; if (CAPS.indexOf(n) >= 0) { DB.cap = n; save(true); render(); toast(t("saved")); } },
  qastage: () => qaPreview(),
  ntf: el => ntfToggle(el)
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el || el.getAttribute("aria-disabled") === "true" || el.disabled) return;
  const H = ACT[el.dataset.a];
  if (H) H(el, e, el.dataset.v, el.dataset.id);
});
document.addEventListener("input", e => { const k = e.target && e.target.dataset && e.target.dataset.i; if (k && INP[k]) INP[k](e.target, e); });
document.addEventListener("change", e => { const k = e.target && e.target.dataset && e.target.dataset.ch; if (k && CHG[k]) CHG[k](e.target, e); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && SHEET && !document.querySelector(".dlg-bg")) { closeSheet(); return; }
  const k = e.key === "Enter" && e.target && e.target.dataset && e.target.dataset.enter;
  if (k && ACT[k]) { e.preventDefault(); ACT[k](e.target, e); }
});
function onHide() { if (PENDING) PENDING.hidden = true; if (DB.sync.on && DB.sync.pend && !SYNCING) syncNow(false); }
function onShow() {
  if (DB.sync.on && !SYNCING && (!DB.sync.last || Date.now() - new Date(DB.sync.last).getTime() > 60000)) syncNow(false);
  if (PENDING && PENDING.hidden) { const p = PENDING; PENDING = null; p.fn(); return; }
  if (!SHEET && DB.gate && DB.profile.name && lastDay && lastDay !== today()) render();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") onHide(); else onShow(); });
window.addEventListener("blur", onHide);
window.addEventListener("focus", onShow);

render();
if (SYNC_OK && DB.sync.on) setTimeout(() => syncNow(false), 600);
window.addEventListener("online", () => { if (DB.sync.on) syncNow(false); });
try { if ("serviceWorker" in navigator && /^https:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) { /* offline shell is optional */ }
})();

</script>
</body>
</html>
